    type: "sentinel"
  ec2-network-acl-should-have-subnet-ids:
    path: "policies/ec2/ec2-network-acl-should-have-subnet-ids.sentinel"
    governed_resources: ["aws_network_acl", "aws_network_acl_association"]
    provider: "AWS"
    regulations:
      - name: "PCI DSS"
    service: "EC2"
