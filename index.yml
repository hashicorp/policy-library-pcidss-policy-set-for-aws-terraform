  eks-cluster-endpoints-restrict-public-access:
    path: "policies/eks/eks-cluster-endpoints-restrict-public-access.sentinel"
    governed_resources: ["aws_eks_cluster"]
    provider: "AWS"
    regulations:
      - name: "PCI DSS"
    service: "EKS"
    description: "This policy checks if 'aws_eks_cluster' resources have their unrestricted public endpoint access"
