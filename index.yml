  dms-mongo-db-authentication-enabled:
    path: "policies/dms/dms-mongo-db-authentication-enabled.sentinel"
    governed_resources: ["aws_dms_endpoint"]
    provider: "AWS"
    regulations:
      - name: "PCI DSS"
