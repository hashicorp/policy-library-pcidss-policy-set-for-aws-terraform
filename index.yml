policies:
  acm-rsa-certificate-key-length-atleast-2048:
    path: "policies/acm/acm-rsa-certificate-key-length-atleast-2048.sentinel"
    governed_resources: ["aws_acm_certificate"]
    provider: "AWS"
    regulations:
      - name: "PCI DSS"
    service: "ACM"
    description: "This policy requires resources of type `aws_acm_certificate` with rsa key algorithm should have atleast 2048 bits key length."
    type: "sentinel"
  api-gateway-access-logging-should-be-configured:
    path: "policies/api-gateway/api-gateway-access-logging-should-be-configured.sentinel"
    governed_resources: ["aws_apigatewayv2_stage"]
    provider: "AWS"
    regulations:
      - name: "PCI DSS"
    service: "API Gateway"
    description: "This policy checks if 'aws_apigatewayv2_stage' have access logging configured."
    type: "sentinel"
  appsync-field-level-logging-should-be-enabled:
    path: "policies/appsync/appsync-field-level-logging-should-be-enabled.sentinel"
    governed_resources: ["aws_appsync_graphql_api"]
    provider: "AWS"
    regulations:
      - name: "PCI DSS"
    service: "AppSync"
    description: "This policy requires resources of type `aws_appsync_graphql_api` have attribute `log_config` with `field_log_level` set to `ERROR` or `ALL`."
    type: "sentinel"
  aurora-postgresql-db-clusters-should-publish-logs-to-cloudwatch-logs:
    path: "policies/rds/aurora-postgresql-db-clusters-should-publish-logs-to-cloudwatch-logs.sentinel"
    governed_resources: ["aws_rds_cluster"]
    provider: "AWS"
    regulations:
      - name: "PCI DSS"
    service: "RDS"
    description: "This control checks whether an Amazon Aurora PostgreSQL DB cluster is configured to publish logs to Amazon CloudWatch Logs."
    type: "sentinel"
  autoscaling-group-with-load-balancer-attached-should-have-elb-healthcheck:
    path: "policies/autoscaling-group/autoscaling-group-with-load-balancer-attached-should-have-elb-healthcheck.sentinel"
    governed_resources: ["aws_autoscaling_attachment", "aws_autoscaling_group"]
    provider: "AWS"
    regulations:
      - name: "PCI DSS"
    service: "Auto Scaling Group"
    description: "This policy requires `aws_autoscaling_group` resources to be associated with load balancers and to have attribute 'health_check_health_check_type' should be 'ELB'."
    type: "sentinel"
  autoscaling-launch-config-public-ip-disabled:
    path: "policies/autoscaling-group/autoscaling-launch-config-public-ip-disabled.sentinel"
    governed_resources: ["aws_launch_configuration"]
    provider: "AWS"
    regulations:
      - name: "PCI DSS"
    service: "Auto Scaling Group"
    description: "This policy requires resources of type `aws_launch_configuration` should have 'associate_public_ip_address' set to false."
    type: "sentinel"
  cloudfront-associated-with-waf:
    path: "policies/cloudfront/cloudfront-associated-with-waf.sentinel"
    governed_resources: ["aws_cloudfront_distribution"]
    provider: "AWS"
    regulations:
      - name: "PCI DSS"
    service: "CloudFront"
    description: "This policy checks whether 'aws_cloudfront_distribution' are associated with either AWS WAF Classic or AWS WAF web ACLs."
    type: "sentinel"
  cloudfront-distributions-should-encrypt-traffic-to-custom-origins:
    path: "policies/cloudfront/cloudfront-distributions-should-encrypt-traffic-to-custom-origins.sentinel"
    governed_resources: ["aws_cloudfront_distribution"]
    provider: "AWS"
    regulations:
      - name: "PCI DSS"
    service: "CloudFront"
    description: "This control checks whether 'aws_cloudfront_distribution' are encrypting traffic to custom origins."
    type: "sentinel"
  cloudfront-distributions-should-have-logging-enabled:
    path: "policies/cloudfront/cloudfront-distributions-should-have-logging-enabled.sentinel"
    governed_resources: ["aws_cloudfront_distribution"]
    provider: "AWS"
    regulations:
      - name: "PCI DSS"
    service: "CloudFront"
    description: "This control checks whether server access logging is enabled on 'aws_cloudfront_distribution'."
    type: "sentinel"
  cloudfront-distributions-should-not-use-deprecated-ssl-protocols:
    path: "policies/cloudfront/cloudfront-distributions-should-not-use-deprecated-ssl-protocols.sentinel"
    governed_resources: ["aws_cloudfront_distribution"]
    provider: "AWS"
    regulations:
      - name: "PCI DSS"
    service: "CloudFront"
    description: "This control checks whether 'aws_cloudfront_distribution' are using deprecated SSL protocols for HTTPS communication between CloudFront edge locations and your custom origins."
    type: "sentinel"
  cloudfront-s3-origin-non-existent-bucket:
    path: "policies/cloudfront/cloudfront-s3-origin-non-existent-bucket.sentinel"
    governed_resources: ["aws_cloudfront_distribution", "aws_s3_bucket"]
    provider: "AWS"
    regulations:
      - name: "PCI DSS"
    service: "CloudFront"
    description: "This policy checks whether 'aws_cloudfront_distribution' are pointing to non-existent Amazon S3 origins."
    type: "sentinel"
  cloudfront-should-have-default-root-object-configured:
    path: "policies/cloudfront/cloudfront-should-have-default-root-object-configured.sentinel"
    governed_resources: ["aws_cloudfront_distribution"]
    provider: "AWS"
    regulations:
      - name: "PCI DSS"
    service: "CloudFront"
    description: "This control checks whether an 'aws_cloudfront_distribution' is configured to return a specific object that is the default root object."
    type: "sentinel"
  cloudfront-should-require-encryption-in-transit:
    path: "policies/cloudfront/cloudfront-should-require-encryption-in-transit.sentinel"
    governed_resources: ["aws_cloudfront_distribution"]
    provider: "AWS"
    regulations:
      - name: "PCI DSS"
    service: "CloudFront"
    description: "This control checks whether an 'aws_cloudfront_distribution' requires viewers to use HTTPS directly or whether it uses redirection."
    type: "sentinel"
  cloudtrail-bucket-should-have-access-logging-enabled:
    path: "policies/cloudtrail/cloudtrail-bucket-should-have-access-logging-enabled.sentinel"
    governed_resources: ["aws_cloudtrail", "aws_s3_bucket_logging"]
    provider: "AWS"
    regulations:
      - name: "PCI DSS"
    service: "CloudTrail"
    description: "This policy requires that resources of type `aws_cloudtrail` have bucket access logging enabled."
    type: "sentinel"
  cloudtrail-cloudwatch-logs-group-arn-present:
    path: "policies/cloudtrail/cloudtrail-cloudwatch-logs-group-arn-present.sentinel"
    governed_resources: ["aws_cloudtrail"]
    provider: "AWS"
    regulations:
      - name: "PCI DSS"
    service: "CloudTrail"
    description: "This policy requires resources of type `aws_cloudtrail` to have cloudwatch log group arn set."
    type: "sentinel"
  cloudtrail-log-file-validation-enabled:
    path: "policies/cloudtrail/cloudtrail-log-file-validation-enabled.sentinel"
    governed_resources: ["aws_cloudtrail"]
    provider: "AWS"
    regulations:
      - name: "PCI DSS"
    service: "CloudTrail"
    description: "This policy requires resources of type `aws_cloudtrail` to have log file validation enabled."
    type: "sentinel"
  cloudtrail-s3-bucket-should-not-be-publicly-accessible:
    path: "policies/cloudtrail/cloudtrail-s3-bucket-should-not-be-publicly-accessible.sentinel"
    governed_resources: ["aws_cloudtrail", "aws_s3_bucket", "aws_s3_bucket_acl", "aws_s3_bucket_public_access_block"]
    provider: "AWS"
    regulations:
      - name: "PCI DSS"
    service: "CloudTrail"
    description: "This policy requires the S3 bucket associated with a CloudTrail to be not publicly accessible."
    type: "sentinel"
  cloudtrail-server-side-encryption-enabled:
    path: "policies/cloudtrail/cloudtrail-server-side-encryption-enabled.sentinel"
    governed_resources: ["aws_cloudtrail"]
    provider: "AWS"
    regulations:
      - name: "PCI DSS"
    service: "CloudTrail"
    description: "This policy requires that resources of type `aws_cloudtrail` have server-side encryption enabled."
    type: "sentinel"
  codebuild-s3-logs-should-be-encrypted:
    path: "policies/codebuild/codebuild-s3-logs-should-be-encrypted.sentinel"
    governed_resources: ["aws_codebuild_project"]
    provider: "AWS"
    regulations:
      - name: "PCI DSS"
    service: "CodeBuild"
    description: "This control checks if Amazon S3 logs for an 'aws_codebuild_project' are encrypted."
    type: "sentinel"
  dms-auto-minor-version-upgrade-check:
    path: "policies/dms/dms-auto-minor-version-upgrade-check.sentinel"
    governed_resources: ["aws_dms_replication_instance"]
    provider: "AWS"
    regulations:
      - name: "PCI DSS"
    service: "DMS"
    description: "This policy checks if resources of type 'aws_dms_replication_instance' have the 'auto_minor_version_upgrade' attribute set to true"
    type: "sentinel"
  dms-endpoint-should-be-ssl-configured:
    path: "policies/dms/dms-endpoint-should-be-ssl-configured.sentinel"
    governed_resources: ["aws_dms_endpoint"]
    provider: "AWS"
    regulations:
      - name: "PCI DSS"
    service: "DMS"
    description: "This policy checks if resources of type 'aws_dms_endpoint' have the 'certificate_arn' shouldn't be empty"
