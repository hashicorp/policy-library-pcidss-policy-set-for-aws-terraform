  ecr-tag-immutability-configured:
    path: "policies/ecr/ecr-tag-immutability-configured.sentinel"
    governed_resources: ["aws_ecr_repository"]
    provider: "AWS"
    regulations:
      - name: "PCI DSS"
    service: "ECR"
