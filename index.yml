  ec2-launch-template-imdsv2-check:
    path: "policies/ec2/ec2-launch-template-imdsv2-check.sentinel"
    governed_resources: ["aws_launch_template"]
    provider: "AWS"
    regulations:
      - name: "PCI DSS"
    service: "EC2"
