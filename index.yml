  dms-replication-instances-should-not-be-public:
    path: "policies/dms/dms-replication-instances-should-not-be-public.sentinel"
    governed_resources: ["aws_dms_replication_instance"]
    provider: "AWS"
    regulations:
      - name: "PCI DSS"
    service: "DMS"
    description: "This policy checks if resources of type 'aws_dms_replication_instance' have the 'publicly_accessible' attribute set to false"
    type: "sentinel"
  dms-replication-task-logging-enabled:
    path: "policies/dms/dms-replication-task-logging-enabled.sentinel"
    governed_resources: ["aws_dms_replication_task"]
    provider: "AWS"
    regulations:
      - name: "PCI DSS"
    service: "DMS"
    description: "This policy checks if resources of type 'aws_dms_replication_task' have the 'replication_task_settings' have logging enabled"
    type: "sentinel"
  docdb-cluster-audit-logging-enabled:
    path: "policies/docdb/docdb-cluster-audit-logging-enabled.sentinel"
    governed_resources: ["aws_docdb_cluster"]
    provider: "AWS"
    regulations:
      - name: "PCI DSS"
    service: "DocDB"
    description: "This policy checks if resources of type 'aws_docdb_cluster' have the 'enabled_cloudwatch_logs_exports attribute' set to 'audit'"
    type: "sentinel"
  docdb-cluster-backup-retention-check:
    path: "policies/docdb/docdb-cluster-backup-retention-check.sentinel"
    governed_resources: ["aws_docdb_cluster"]
    provider: "AWS"
    regulations:
      - name: "PCI DSS"
    service: "DocDB"
